let currentQ = 0;
let selectedQuestions = [];
let score = 0;
let total = 0;

document.getElementById("category").addEventListener("change", function(){
    let val = this.value;
    selectedQuestions = questions[val];
    currentQ = 0;
    score = 0;
    total = selectedQuestions.length;

    loadQuestion();
});

function loadQuestion(){
    document.getElementById("result").innerHTML = "";
    document.getElementById("nextBtn").classList.add("d-none");

    let q = selectedQuestions[currentQ];
    document.getElementById("question").innerText = `Q${currentQ+1}: ${q.q}`;

    let optionsHTML = "";
    q.o.forEach(opt => {
        optionsHTML += `<button class="btn btn-outline-dark w-100 mb-2" onclick="checkAnswer('${opt}')">${opt}</button>`;
    });

    document.getElementById("options").innerHTML = optionsHTML;
}

function checkAnswer(ans){
    let correct = selectedQuestions[currentQ].a;

    if(ans === correct){
        document.getElementById("result").innerHTML = "✅ Correct";
        score++;
    } else {
        document.getElementById("result").innerHTML = "❌ Wrong (Correct: " + correct + ")";
    }

    document.getElementById("nextBtn").classList.remove("d-none");
}

document.getElementById("nextBtn").addEventListener("click", function(){
    currentQ++;

    if(currentQ < total){
        loadQuestion();
    } else {
        showResult();
    }
});

function showResult(){
    document.getElementById("question").innerText = "Quiz Completed 🎉";
    document.getElementById("options").innerHTML = "";

    let wrong = total - score;

    document.getElementById("result").innerHTML =
        `Score: ${score}/${total} <br>
         Right: ${score} <br>
         Wrong: ${wrong}`;
}

</script>

</body>
</html>
